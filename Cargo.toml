[package]
name = "sessanchor"
version = "0.1.0"
edition = "2021"
publish = false
description = "Agent-friendly SSH session control (contract prototype)"

[dependencies]
rusqlite = { version = "0.40.1", features = ["bundled"] }
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[[bin]]
name = "sanc"
path = "src/main.rs"
